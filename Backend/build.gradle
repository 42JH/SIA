plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sia'
version = '0.1.0'
description = 'sia-assistant'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    springAiVersion = '2.0.1'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'   // DB 는 전부 JdbcTemplate — JPA 없음
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Boot 4 웹 스타터는 Jackson 을 전이시키지 않는다 — ObjectMapper 직접 사용(runtime.json 등)의 명시 의존성
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Boot 4 는 기술별 자동구성이 모듈로 분리됐다 — flyway-core 단독으로는 마이그레이션이 돌지 않는다
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.xerial:sqlite-jdbc'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
